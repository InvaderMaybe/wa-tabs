name: WATabs
options:
  bundleIdPrefix: com.itpr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WATabs:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: WATabs
        excludes: ["Resources/*.js"]
      - path: WATabs/Resources/wa-mobile.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itpr.watabs
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: WATabs/Info.plist
      properties:
        CFBundleDisplayName: WA Tabs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Камера нужна для фото, видео и видеозвонков в WhatsApp.
        NSMicrophoneUsageDescription: Микрофон нужен для голосовых сообщений и звонков в WhatsApp.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы отправлять их в WhatsApp.
        NSPhotoLibraryAddUsageDescription: Доступ нужен, чтобы сохранять фото из WhatsApp.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
