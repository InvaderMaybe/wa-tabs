name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["design/**", "tools/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write   # создание релиза по тегу

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WATabs.xcodeproj -scheme WATabs \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | grep -E "error:|warning: .*WATabs|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/WATabs.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WATabs.app Payload/
          zip -qry WATabs.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WATabs-ipa
          path: WATabs.ipa

      - name: SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${{ steps.ver.outputs.version }}"
          size=$(stat -f%z WATabs.ipa)
          repo="https://github.com/${GITHUB_REPOSITORY}"
          cat > source.json <<EOF
          {
            "name": "WA Tabs",
            "identifier": "com.itpr.watabs.source",
            "apps": [{
              "name": "WA Tabs",
              "bundleIdentifier": "com.itpr.watabs",
              "developerName": "itpr",
              "subtitle": "Несколько WhatsApp во вкладках",
              "localizedDescription": "Несколько WhatsApp Web в одном приложении.",
              "iconURL": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/design/icon.png",
              "tintColor": "25D366",
              "versions": [{
                "version": "$v",
                "buildVersion": "${{ github.run_number }}",
                "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "size": $size,
                "downloadURL": "$repo/releases/download/v$v/WATabs.ipa",
                "minOSVersion": "17.0"
              }],
              "appPermissions": { "entitlements": [], "privacy": {} }
            }],
            "news": []
          }
          EOF
          cat source.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WATabs.ipa
            source.json
