name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["design/**", "tools/**", "**.md"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WATabs.xcodeproj -scheme WATabs \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | grep -E "error:|warning: .*WATabs|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/WATabs.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WATabs.app Payload/
          zip -qry WATabs.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WATabs-ipa
          path: WATabs.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WATabs.ipa
